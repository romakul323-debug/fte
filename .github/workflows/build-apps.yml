name: Сборка APK и iOS

on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      server:
        description: 'Адрес сервера по умолчанию, вшивается в приложение (можно оставить пустым)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  VOLNA_SERVER: ${{ inputs.server || vars.VOLNA_SERVER }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Веб-часть → Android
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          node prepare-web.js
          npx cap sync android
      - name: Сборка APK
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - run: |
          mkdir -p dist
          cp app/android/app/build/outputs/apk/release/app-release.apk dist/Volna.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/Volna.apk

  ios:
    name: iOS (IPA без подписи)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Самый новый Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Использую $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Веб-часть → iOS
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          node prepare-web.js
          npx cap sync ios
      - name: Сборка
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -n 60
          test -d "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
      - name: Упаковка IPA
        run: |
          mkdir -p dist/Payload
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" dist/Payload/
          cd dist && zip -qry Volna-unsigned.ipa Payload && rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/Volna-unsigned.ipa

  testflight:
    name: iOS → TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Ключи App Store Connect не заданы — пропускаю
        if: env.HAS_ASC != 'true'
        run: echo "::notice::Добавь секреты APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, чтобы сборки уходили в TestFlight"
      - uses: actions/checkout@v4
        if: env.HAS_ASC == 'true'
      - name: Самый новый Xcode
        if: env.HAS_ASC == 'true'
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - uses: actions/setup-node@v4
        if: env.HAS_ASC == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Веб-часть → iOS
        if: env.HAS_ASC == 'true'
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          node prepare-web.js
          npx cap sync ios
      - name: Ключ API Apple
        if: env.HAS_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          # можно вставить как текст файла .p8 или как base64
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$ASC_KEY_P8" > "$KEY"; else printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"; fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: Сборка с подписью
        if: env.HAS_ASC == 'true'
        working-directory: app/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tail -n 80
          test -d "$RUNNER_TEMP/App.xcarchive"
      - name: Загрузка в TestFlight
        if: env.HAS_ASC == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 60
          echo "::notice::Сборка ${{ github.run_number }} загружена в App Store Connect. Через 5–15 минут она появится в TestFlight."

  release:
    name: Публикация
    needs: [android, ios]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: volna-build-${{ github.run_number }}
          name: Волна, сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Android:** скачай `Volna.apk` и установи (разреши установку из неизвестных источников).
            **iPhone:** `Volna-unsigned.ipa` ставится через Sideloadly с ПК со своим Apple ID.
          files: dist/*
