name: fte
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fte
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: token.txt
          key: fte-token-${{ github.run_id }}
          restore-keys: fte-token-
      - env:
          FTE_TOKEN: ${{ secrets.FTE_TOKEN }}
        run: node fetch-once.mjs
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add events.json
          git commit -m events || echo nochange
          git push
