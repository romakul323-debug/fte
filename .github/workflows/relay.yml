name: fte
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: fte
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: token.txt
          key: fte-token-${{ github.run_id }}
          restore-keys: fte-token-
      - name: loop
        env:
          FTE_TOKEN: ${{ secrets.FTE_TOKEN }}
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          end=$((SECONDS+3000))
          while [ $SECONDS -lt $end ]; do
            node fetch-once.mjs || true
            git add events.json || true
            git commit -m events || echo nochange
            git pull --rebase --autostash || true
            git push || true
            sleep 45
          done
      - name: chain
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run relay.yml --ref main || true
