name: GFXTuner
options:
  bundleIdPrefix: ru.gfxtuner
  deploymentTarget:
    iOS: "16.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  GFXTuner:
    type: application
    platform: iOS
    sources:
      - GFXTuner
      - Shared
    dependencies:
      - target: LensyLive
    info:
      path: GFXTuner/Info.plist
      properties:
        CFBundleDisplayName: "تحسين الرؤية"
        CFBundleDevelopmentRegion: ar
        NSLocalNetworkUsageDescription: "Lensy يرسل ملف DNS إلى Safari من الهاتف نفسه."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBlack
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - igame1320
          - fb1036341366506456
          - tencent1106545419
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.gfxtuner.app
        PRODUCT_NAME: GFXTuner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  LensyLive:
    type: app-extension
    platform: iOS
    sources:
      - LensyLive
      - Shared
    info:
      path: LensyLive/Info.plist
      properties:
        CFBundleDisplayName: Lensy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.gfxtuner.app.live
        PRODUCT_NAME: LensyLive
        SKIP_INSTALL: YES
schemes:
  GFXTuner:
    build:
      targets:
        GFXTuner: all
    archive:
      config: Release
