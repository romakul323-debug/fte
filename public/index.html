<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1e1f22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Волна">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<title>Волна</title>
</head>
<body>
<div id="auth" class="auth" hidden>
  <div class="auth-card">
    <img class="logo" src="icons/icon-192.png" alt="">
    <h1>Волна</h1>
    <p class="muted">Голос, чат и свои серверы для своих</p>

    <label id="serverField" hidden>Адрес сервера<input id="authServer" type="text" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://xxx.onrender.com"></label>

    <button type="button" class="btn google" id="googleBtn" hidden>Продолжить с Google</button>
    <div class="or" id="authOr" hidden>или</div>

    <div class="seg" id="authSeg" hidden>
      <button type="button" data-tab="pass" class="on">Ник и пароль</button>
      <button type="button" data-tab="code">Код на почту</button>
    </div>

    <form id="authForm">
      <label><span id="loginLabel">Ник или почта</span><input id="authUser" autocomplete="username" autocapitalize="off" spellcheck="false" required minlength="2" maxlength="60"></label>
      <label>Пароль<input id="authPass" type="password" autocomplete="current-password" required minlength="6"></label>
      <button class="btn primary" id="authSubmit">Войти</button>
      <button type="button" class="link" id="authToggle">Нет аккаунта? Создать</button>
    </form>

    <form id="codeForm" hidden>
      <div id="codeStep1">
        <label>Почта<input id="codeEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="you@gmail.com"></label>
      </div>
      <div id="codeStep2" hidden>
        <p class="hint-line" id="codeSentTo"></p>
        <input id="codeValue" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" aria-label="Код из письма">
      </div>
      <div id="codeStep3" hidden>
        <p class="hint-line">Почта подтверждена. Как тебя называть?</p>
        <label>Ник<input id="codeNick" autocapitalize="off" spellcheck="false" maxlength="24"></label>
      </div>
      <button class="btn primary" id="codeSubmit">Получить код</button>
      <div class="row-links" id="codeLinks" hidden>
        <button type="button" class="link small" id="codeBack">Другая почта</button>
        <button type="button" class="link small" id="codeResend">Отправить код ещё раз</button>
      </div>
    </form>

    <div id="authError" class="error"></div>
    <button type="button" class="link small" id="serverToggle" hidden>Указать свой сервер</button>
  </div>
</div>

<div id="netbar" class="netbar" hidden><span></span><button type="button" class="link" id="netChange">Сменить сервер</button></div>
<div id="app" class="app" hidden>
  <nav id="servers" class="servers"></nav>
  <aside id="sidebar" class="sidebar">
    <header id="serverHeader" class="server-header"></header>
    <div id="channels" class="channels"></div>
    <div id="voicePanel" class="voice-panel" hidden></div>
    <div id="userPanel" class="user-panel"></div>
  </aside>
  <div id="scrim" class="scrim"></div>
  <main class="main">
    <header class="chan-header">
      <button id="menuBtn" class="icon-btn only-mobile" aria-label="Меню"></button>
      <span id="chanTitle" class="chan-title"></span>
      <button id="membersBtn" class="icon-btn" aria-label="Участники"></button>
    </header>
    <section id="emptyView" class="empty"></section>
    <section id="textView" class="text-view" hidden>
      <div id="messages" class="messages"></div>
      <div id="typing" class="typing"></div>
      <form id="composer" class="composer">
        <textarea id="msgInput" rows="1" placeholder="Сообщение" maxlength="2000" enterkeyhint="send"></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Отправить"></button>
      </form>
    </section>
    <section id="callView" class="call-view" hidden>
      <div id="tiles" class="tiles"></div>
      <div id="callBar" class="call-bar"></div>
    </section>
  </main>
  <aside id="members" class="members"></aside>
</div>
<div id="audios" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast"></div>
<script src="config.js"></script>
<script src="vendor/socket.io.min.js"></script>
<script src="app.js"></script>
</body>
</html>
