# Автодеплой на Render (бесплатный тариф): сервер + база Postgres, подключаются друг к другу сами.
# Бесплатная база Render живёт 30 дней — потом DATABASE_URL можно заменить на постоянную (например, Neon).
databases:
  - name: volna-db
    plan: free
    region: frankfurt
    databaseName: volna
    user: volna

services:
  - type: web
    name: volna
    runtime: node
    plan: free
    region: frankfurt
    branch: volna
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node server.js
    healthCheckPath: /api/config
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: volna-db
          property: connectionString
